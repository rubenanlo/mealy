[project]
name = "mealy-worker"
version = "0.1.0"
description = "Mealy ingestion worker: URL / paste / reel / photo / PDF -> {verbatim, canonical}"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "anthropic",
    "openai",
    "recipe-scrapers",
    "yt-dlp",
    "httpx",
    "extruct",
    "python-multipart",
    "pyjwt",
    "pypdf",
    "pypdfium2",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mealy_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
