# Mealy ingestion worker on Fly.io.
# Scale-to-zero single machine (chosen 2026-08-27 to keep cost ~$1-2/mo):
# suspends when idle, wakes on request. Background capture jobs run inside
# the FastAPI process after the HTTP response, so kill_timeout gives
# uvicorn up to 5 minutes to drain in-flight jobs before a stop; a job
# outliving that window must be retried. Region cdg = Paris, next to the
# household and Supabase eu-west-3.

app = "mealy-worker"
primary_region = "cdg"
kill_timeout = "5m"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
